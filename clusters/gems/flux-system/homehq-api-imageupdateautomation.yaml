---
{
  apiVersion: "image.toolkit.fluxcd.io/v1",
  kind: "ImageUpdateAutomation",
  metadata: {
    name: "homehq-api",
    namespace: "flux-system",
  },
  spec: {
    interval: "1m",
    sourceRef: {
      kind: "GitRepository",
      name: "gems-push",
    },
    git: {
      checkout: {
        ref: {
          branch: "main",
        },
      },
      commit: {
        author: {
          name: "fluxcdbot",
          email: "fluxcdbot@users.noreply.github.com",
        },
        messageTemplate: "chore(homehq): {{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}",
      },
      push: {
        branch: "main",
      },
    },
    update: {
      path: "./apps/homehq",
    },
  },
}
