---
{
  apiVersion: "image.toolkit.fluxcd.io/v1",
  kind: "ImageRepository",
  metadata: {
    name: "homehq-api",
    namespace: "flux-system",
  },
  spec: {
    image: "ghcr.io/tonybutt/homehq-api",
    interval: "1m",
    secretRef: {
      name: "ghcr-pull-secret",
    },
  },
}
---
{
  apiVersion: "image.toolkit.fluxcd.io/v1",
  kind: "ImagePolicy",
  metadata: {
    name: "homehq-api",
    namespace: "flux-system",
  },
  spec: {
    imageRepositoryRef: {
      name: "homehq-api",
    },
    digestReflectionPolicy: "Always",
    interval: "1m",
    filterTags: {
      pattern: "^(?P<ts>\\d{14})-[a-f0-9]+$",
      extract: "$ts",
    },
    policy: {
      numerical: {
        order: "asc",
      },
    },
  },
}
