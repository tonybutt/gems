apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-cloudflared-emilyismy-love
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infrastructure-configs
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: app-cloudflared-emilyismy-love
  prune: true
  wait: true
