apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-opengym
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: ExternalArtifact
    name: app-opengym
  prune: true
  wait: true
