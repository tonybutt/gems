# chart: cilium/cilium
# version: 1.18.7
# repo: https://helm.cilium.io/
# namespace: kube-system
# release-name: cilium
ipam:
  mode: kubernetes
gatewayAPI:
  enabled: true
  gatewayClass:
    create: "true"
l2announcements:
  enabled: true
kubeProxyReplacement: true
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
k8sServiceHost: localhost
k8sServicePort: 7445
# Hubble disabled for now: hubble-relay has been crashlooping (DNS timeouts
# resolving hubble-peer), failing the Flux infrastructure-controllers health
# check and blocking downstream reconciliation.
hubble:
  enabled: false
