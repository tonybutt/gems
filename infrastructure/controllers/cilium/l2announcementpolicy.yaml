apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: policy1
spec:
  nodeSelector:
    matchExpressions:
      - {
          key: somekey,
          operator: NotIn,
          values: ["will-match-and-announce-all-services"],
        }
  interfaces:
    - ^en[a-z0-9]+
  externalIPs: true
  loadBalancerIPs: true
