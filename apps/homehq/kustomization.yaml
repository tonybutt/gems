---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "homehq",
  labels: [{
    includeSelectors: false,
    includeTemplates: true,
    pairs: {
      app.kubernetes.io/name: "homehq",
      app.kubernetes.io/part-of: "homehq",
      app.kubernetes.io/managed-by: "flux",
    },
  }],
  resources: [
    "ns.yaml",
    "serviceaccount.yaml",
    "persistentvolumeclaim.yaml",
    "deployment.yaml",
    "service.yaml",
    "certificate.yaml",
    "referencegrant.yaml",
    "httproute.yaml",
    "ciliumnetworkpolicy.yaml",
    "secrets/ghcr-pull-secret.encrypted.yaml",
  ],
  generatorOptions: {
    disableNameSuffixHash: true,
    annotations: {
      reloader.stakater.com/auto: "true",
    },
  },
  configMapGenerator: [{
    name: "homehq-api-config",
    files: [
      "config.toml",
    ],
  }],
  secretGenerator: [{
    name: "homehq-api",
    envs: [
      "secrets/homehq-api.encrypted.env",
    ],
  }],
  images: [{
    name: "ghcr.io/tonybutt/homehq-api",
    newTag: "20261011181950-62a309f", # {"$imagepolicy": "flux-system:homehq-api:tag"}
    digest: "sha256:6f1ce3478af7d9feee19891ca1ed4bad4f1653437f0a5cc11d17fee87f0180a4", # {"$imagepolicy": "flux-system:homehq-api:digest"}
  }],
}
