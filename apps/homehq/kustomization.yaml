---
{
  apiVersion: "kustomize.config.k8s.io/v1beta1",
  kind: "Kustomization",
  namespace: "homehq",
  labels: [{
    includeSelectors: false,
    includeTemplates: true,
    pairs: {
      app.kubernetes.io/name: "homehq",
      app.kubernetes.io/part-of: "homehq",
      app.kubernetes.io/managed-by: "flux",
    },
  }],
  resources: [
    "ns.yaml",
    "serviceaccount.yaml",
    "persistentvolumeclaim.yaml",
    "deployment.yaml",
    "service.yaml",
    "site-deployment.yaml",
    "site-service.yaml",
    "certificate.yaml",
    "referencegrant.yaml",
    "httproute.yaml",
    "ciliumnetworkpolicy.yaml",
    "secrets/ghcr-pull-secret.encrypted.yaml",
  ],
  generatorOptions: {
    disableNameSuffixHash: true,
    annotations: {
      reloader.stakater.com/auto: "true",
    },
  },
  configMapGenerator: [{
    name: "homehq-api-config",
    files: [
      "config.toml",
    ],
  }],
  secretGenerator: [{
    name: "homehq-api",
    envs: [
      "secrets/homehq-api.encrypted.env",
    ],
  }],
  images: [{
    name: "ghcr.io/tonybutt/homehq-api",
    newTag: "20261112144019-68c898e", # {"$imagepolicy": "flux-system:homehq-api:tag"}
    digest: "sha256:b68326f6a90c1b4c2bdfed1323b8829b6c1b8a01cc9b607953935e514a652375", # {"$imagepolicy": "flux-system:homehq-api:digest"}
  }, {
    name: "ghcr.io/tonybutt/homehq-site",
    newTag: "pending", # {"$imagepolicy": "flux-system:homehq-site:tag"}
  }],
}
