---
{
  apiVersion: "gateway.networking.k8s.io/v1",
  kind: "HTTPRoute",
  metadata: {
    name: "homehq-api",
  },
  spec: {
    parentRefs: [{
      name: "cloudflare-tunnel",
      namespace: "default",
      sectionName: "https-homehq",
    }, {
      name: "cloudflare-tunnel",
      namespace: "default",
      sectionName: "http",
    }],
    hostnames: [
      "homehq.abutt.dev",
    ],
    # Only the client API goes through the gateway; /healthz, /readyz and
    # /metrics stay reachable inside the cluster only (probes hit the pod).
    rules: [{
      matches: [{
        path: {
          type: "PathPrefix",
          value: "/api",
        },
      }],
      backendRefs: [{
        name: "homehq-api",
        port: 80,
      }],
    }, {
      matches: [{
        path: {
          type: "PathPrefix",
          value: "/privacy",
        },
      }],
      backendRefs: [{
        name: "homehq-site",
        port: 80,
      }],
    }],
  },
}
