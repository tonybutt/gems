---
{
  apiVersion: "gateway.networking.k8s.io/v1",
  kind: "HTTPRoute",
  metadata: {
    name: "homehq-api",
  },
  spec: {
    parentRefs: [{
      name: "cloudflare-tunnel",
      namespace: "default",
      sectionName: "https-homehq",
    }, {
      name: "cloudflare-tunnel",
      namespace: "default",
      sectionName: "http",
    }],
    hostnames: [
      "homehq.abutt.dev",
    ],
    rules: [{
      backendRefs: [{
        name: "homehq-api",
        port: 80,
      }],
    }],
  },
}
