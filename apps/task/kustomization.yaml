apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: task
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/name: task
      app.kubernetes.io/part-of: task
      app.kubernetes.io/managed-by: flux
resources:
  - ns.yaml
  - serviceaccount.yaml
  - persistentvolumeclaim.yaml
  - deployment.yaml
  - service.yaml
  - certificate.yaml
  - referencegrant.yaml
  - httproute.yaml
  - ciliumnetworkpolicy.yaml
  - secrets/ghcr-pull-secret.encrypted.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    reloader.stakater.com/auto: "true"
configMapGenerator:
  - name: task-api-config
    files:
      - config.toml
secretGenerator:
  - name: task-api
    envs:
      - secrets/task-api.encrypted.env
images:
  - name: ghcr.io/tonybutt/task-api
    newTag: 20261011181950-62a309f # {"$imagepolicy": "flux-system:task-api:tag"}
    digest: sha256:6f1ce3478af7d9feee19891ca1ed4bad4f1653437f0a5cc11d17fee87f0180a4 # {"$imagepolicy": "flux-system:task-api:digest"}
